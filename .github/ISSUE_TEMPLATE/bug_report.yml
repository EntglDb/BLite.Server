name: Bug Report
description: Report a bug in BLite.Server (gRPC server, REST API, or Blazor Studio)
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug report. Please fill in as much detail as possible.

  - type: input
    id: version
    attributes:
      label: BLite.Server version
      description: Which version of BLite.Server are you running? Check the binary or release tag (e.g. `1.2.3`).
      placeholder: "e.g. 1.2.3"
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Affected area
      description: Which part of the server does the bug affect?
      options:
        - gRPC layer
        - REST API
        - Blazor Studio
        - Authentication / authorization
        - Transaction manager
        - Configuration / startup
        - Multiple / unsure
    validations:
      required: true

  - type: input
    id: dotnet
    attributes:
      label: .NET version
      description: Output of `dotnet --version` on the server host
      placeholder: "e.g. 10.0.100"
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating system
      description: OS and architecture of the server host (e.g. `Ubuntu 24.04 x64`, `Windows 11 x64`)
      placeholder: "e.g. Ubuntu 24.04 x64"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of the bug.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: |
        Provide the **smallest possible** reproduction: relevant `appsettings.json` snippet,
        client code, or gRPC/REST request (curl, .http file, etc.) that triggers the issue.
        Wrap code in triple backticks with the appropriate language tag.
      placeholder: |
        ```json
        // appsettings.json snippet
        ```

        ```csharp
        // client code or test
        ```
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What actually happened? Include any error message, HTTP status, gRPC status code, and server logs.
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Any other information that might help (deployment mode, Docker, number of databases, etc.)
    validations:
      required: false
